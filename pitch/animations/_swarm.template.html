<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The persona swarm</title>
<style>
  :root { --fb:#1877f2; --bg:#0f172a; --ok:#31a24c; --bad:#e41e3f; --warn:#f0a000; }
  html,body { margin:0; background:var(--bg); color:#e5e7eb; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .stage { position:relative; width:1280px; height:720px; margin:0 auto; overflow:hidden; background: radial-gradient(1000px 500px at 70% 30%, #16213a 0%, var(--bg) 60%); }
  .title { position:absolute; left:32px; top:22px; font-size:22px; font-weight:700; }
  .title small { display:block; font-size:13px; font-weight:500; color:#9ca3af; margin-top:2px; }
  .sim { position:absolute; right:32px; top:26px; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; background:rgba(240,160,0,.15); color:#fcd34d; border:1px solid rgba(240,160,0,.45); padding:4px 10px; border-radius:999px; }
  .lanes { position:absolute; left:32px; top:84px; width:800px; display:grid; grid-template-columns: 1fr 1fr; gap:6px 18px; }
  .lane { display:grid; grid-template-columns: 34px 150px 1fr 150px; align-items:center; gap:8px; height:30px; font-size:13px; opacity:0; transform:translateX(-10px); transition: opacity .4s, transform .4s; }
  .lane.show { opacity:1; transform:none; }
  .lane .av { width:28px; height:28px; border-radius:999px; background:#334155 center/cover; }
  .lane .who b { display:block; font-weight:700; }
  .lane .who span { color:#9ca3af; font-size:11px; }
  .bar { height:6px; background:#1e293b; border-radius:999px; overflow:hidden; position:relative; }
  .bar i { position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg,#1877f2,#60a5fa); border-radius:999px; }
  .bar .tick { position:absolute; top:-5px; width:2px; height:16px; background:#fbbf24; opacity:0; }
  .verdict { display:flex; gap:4px; justify-content:flex-end; opacity:0; transform:scale(.8); transition: opacity .3s, transform .3s; }
  .verdict.show { opacity:1; transform:none; }
  .chip { font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; background:#1e293b; color:#cbd5e1; }
  .chip.take { background:rgba(49,162,76,.25); color:#86efac; }
  .chip.no { background:rgba(228,30,63,.22); color:#fca5a5; }
  .chip.dec { background:rgba(240,160,0,.2); color:#fcd34d; }
  .agg { position:absolute; right:32px; top:96px; width:380px; opacity:0; transition: opacity .6s; }
  .agg.show { opacity:1; }
  .agg .n { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .agg .box { background:#111c33; border:1px solid #1f2b45; border-radius:14px; padding:12px 14px; }
  .agg .box b { font-size:30px; display:block; font-weight:800; color:#fff; }
  .agg .box span { font-size:12px; color:#9ca3af; }
  .agg h4 { margin:16px 0 6px; font-size:13px; color:#9ca3af; text-transform:uppercase; letter-spacing:.06em; }
  .agg li { font-size:13px; line-height:1.35; margin:4px 0 4px 16px; color:#e5e7eb; }
  .quote { position:absolute; left:32px; bottom:26px; width:800px; font-size:14px; color:#cbd5e1; min-height:40px; }
  .quote b { color:#fff; }
  .hint { position:absolute; left:50%; bottom:6px; transform:translateX(-50%); font-size:11px; color:#64748b; }
</style>
</head>
<body>
<div class="stage">
  <div class="title">Stress test: the persona swarm <small id="subtitle"></small></div>
  <div class="sim">simulated users · not user research</div>
  <div class="lanes" id="lanes"></div>
  <div class="agg" id="agg"></div>
  <div class="quote" id="quote"></div>
  <div class="hint">R to replay · every name, number and verdict comes from sim/*.json</div>
</div>
<script>
const DATA = /*__DATA__*/null;
</script>
<script>
(function(){
  const rows = DATA.rows, before = DATA.before, fixes = DATA.fixes;
  const TOTAL = 17000;
  const lanes=document.getElementById('lanes'), agg=document.getElementById('agg'), quote=document.getElementById('quote');
  document.getElementById('subtitle').textContent = `${rows.length} simulated young adults · each played by a Muse agent · using the real endpoints`;
  let timers=[]; const at=(ms,fn)=>timers.push(setTimeout(fn,ms));
  function play(final){
    timers.forEach(clearTimeout); timers=[]; lanes.innerHTML=''; agg.className='agg'; agg.innerHTML=''; quote.innerHTML='';
    rows.forEach((r,i)=>{
      const lane=document.createElement('div'); lane.className='lane';
      lane.innerHTML=`<span class="av" style="background-image:url('${DATA.base}${r.avatar}')"></span><span class="who"><b>${r.name}</b><span>${r.weekend} · $${r.budget}</span></span><span class="bar"><i></i></span><span class="verdict"></span>`;
      lanes.appendChild(lane);
      const start = final?0:200+i*180;
      at(start, ()=>lane.classList.add('show'));
      const dur = final?0:Math.max(2500, Math.min(9000, (r.latencyMs||20000)/5));
      const bar=lane.querySelector('.bar i');
      at(start+100, ()=>{ bar.style.transition=`width ${dur}ms linear`; bar.style.width='100%'; });
      (r.ticks||[]).slice(0,6).forEach((t,k)=>{ const tick=document.createElement('span'); tick.className='tick'; tick.style.left=(8+k*15)+'%'; lane.querySelector('.bar').appendChild(tick); at(start+100+dur*(0.1+k*0.15), ()=>tick.style.opacity='1'); });
      at(start+dur+150, ()=>{
        const v=lane.querySelector('.verdict');
        v.innerHTML = r.declined ? `<span class="chip dec">declined gracefully</span>` : `<span class="chip ${r.wouldTake?'take':'no'}">${r.wouldTake?'would go':'pass'}</span><span class="chip">✨${r.surprising}</span><span class="chip">🛡${r.trustworthy}</span>`;
        v.classList.add('show');
        if(r.reason) quote.innerHTML=`<b>${r.name}:</b> “${r.reason}”`;
      });
    });
    at(final?0:TOTAL-1800, ()=>{
      const ok=rows.filter(r=>!r.error);
      const take=ok.filter(r=>r.wouldTake).length, n=ok.length;
      const avg=k=>(ok.reduce((s,r)=>s+(r[k]||0),0)/Math.max(1,ok.filter(r=>r[k]).length)).toFixed(1);
      const viol=ok.reduce((s,r)=>s+(r.renderedViolations||0),0);
      agg.innerHTML=`<div class="n">
        <div class="box"><b>${take}/${n}</b><span>would take the trip</span></div>
        <div class="box"><b>${viol}</b><span>privacy violations rendered</span></div>
        <div class="box"><b>${avg('surprising')}</b><span>surprising / 5</span></div>
        <div class="box"><b>${avg('trustworthy')}</b><span>trustworthy / 5</span></div></div>
        ${before?`<div style="font-size:12px;color:#9ca3af;margin-top:8px">before fixes: ${before.take}/${before.n} would go · trust ${before.trustworthy}/5</div>`:''}
        <h4>what changed because of them</h4><ul>${(fixes||[]).slice(0,4).map(f=>`<li>${f}</li>`).join('')}</ul>`;
      agg.classList.add('show');
    });
  }
  const final=new URLSearchParams(location.search).get('final')==='1';
  play(final);
  window.addEventListener('keydown',e=>{ if(e.key==='r'||e.key==='R') play(false); });
  window.replaySwarm=()=>play(false);
})();
</script>
</body>
</html>
