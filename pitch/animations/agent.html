<script>
(function () {
  const run = DATA.run, users = DATA.users, cities = DATA.cities;
  const TOTAL_MS = 17000;
  const svg = document.getElementById('map');
  const log = document.getElementById('log');
  const card = document.getElementById('card');
  const ruled = document.getElementById('ruled');
  const counter = document.getElementById('counter');
  document.getElementById('subtitle').textContent = `${run.viewerName} · ${run.input.start} → ${run.input.end} · $${run.input.budget} · ${(run.latencyMs/1000).toFixed(1)}s live`;
  // project lat/lng into the map box
  const lats = cities.map(c=>c.lat), lngs = cities.map(c=>c.lng);
  const minLat=Math.min(...lats)-1.5, maxLat=Math.max(...lats)+1.5, minLng=Math.min(...lngs)-2, maxLng=Math.max(...lngs)+2;
  const X = lng => 40 + (lng-minLng)/(maxLng-minLng)*780;
  const Y = lat => 420 - (lat-minLat)/(maxLat-minLat)*380;
  const byCity = {}; cities.forEach(c=>byCity[c.id]=c);
  const home = users.find(u=>u.id===run.viewerId)?.city;
  const NS='http://www.w3.org/2000/svg';
  const el=(n,a={})=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  let timers=[];
  function reset(){ timers.forEach(clearTimeout); timers=[]; svg.innerHTML=''; log.innerHTML=''; card.className='card'; card.innerHTML=''; ruled.className='ruled'; ruled.innerHTML=''; counter.innerHTML=''; }
  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
  const personEls={}, cityEls={};
  function draw(){
    // edges home → each city
    cities.filter(c=>c.id!==home).forEach(c=>{ svg.appendChild(el('line',{x1:X(byCity[home].lng),y1:Y(byCity[home].lat),x2:X(c.lng),y2:Y(c.lat),stroke:'#1e293b','stroke-width':1})); });
    cities.forEach(c=>{
      const g=el('g',{class:'city'+(c.id===home?' home':''),transform:`translate(${X(c.lng)},${Y(c.lat)})`});
      g.appendChild(el('circle',{class:'ring',r:16}));
      g.appendChild(el('circle',{class:'dot',r:5,fill:'#60a5fa'}));
      const t=el('text',{x:10,y:-8}); t.textContent=c.name; g.appendChild(t);
      const p=el('text',{class:'price',x:10,y:24}); g.appendChild(p);
      svg.appendChild(g); cityEls[c.id]={g,ring:g.children[0],price:p,photos:[]};
      // people around the city
      const ppl=users.filter(u=>u.city===c.id && u.id!==run.viewerId);
      ppl.forEach((u,i)=>{
        const a=(i/ppl.length)*Math.PI*2, r=22+ (i%2)*8;
        const cx=X(c.lng)+Math.cos(a)*r, cy=Y(c.lat)+Math.sin(a)*r;
        const circ=el('circle',{class:'person',cx,cy,r:3.2,fill:u.openToHosting?'#34d399':'#94a3b8',opacity:.18});
        svg.appendChild(circ); personEls[u.id]={circ,u,cx,cy};
      });
    });
  }
  function light(ids, color, r){ ids.forEach(id=>{const p=personEls[id]; if(!p) return; p.circ.setAttribute('opacity','1'); if(color) p.circ.setAttribute('fill',color); if(r) p.circ.setAttribute('r',r);}); }
  function pulse(cityId){ const c=cityEls[cityId]; if(!c) return; c.ring.animate([{opacity:0,r:6},{opacity:.9,r:14},{opacity:0,r:26}],{duration:900,easing:'ease-out'}); }
  function addLog(step){ const d=document.createElement('div'); d.className=step.kind; d.innerHTML=`<span class="t">${(step.at/1000).toFixed(1)}s</span><span class="k"></span><span>${step.text}${step.detail?` <span style="color:#9ca3af">· ${step.detail}</span>`:''}</span>`; log.appendChild(d); while(log.children.length>7) log.removeChild(log.firstChild); }
  function cityFromText(t){ const m=cities.find(c=>t.includes(c.name)); return m?.id; }
  function play(final){
    reset(); draw();
    const steps=run.steps.filter(s=>s.kind!=='model');
    const scale = TOTAL_MS / Math.max(1, run.steps[run.steps.length-1].at);
    const last = steps[steps.length-1];
    let seen=0, hosts=0;
    steps.forEach(s=>{
      const when = final ? 0 : Math.min(TOTAL_MS, s.at*scale);
      at(when, ()=>{
        addLog(s);
        if(s.tool==='scan_network' && s.kind==='result'){ light(s.ids||[]); const ids=(s.ids||[]).filter(i=>personEls[i]); seen=ids.length; hosts=ids.filter(i=>personEls[i].u.openToHosting).length; counter.innerHTML=`<b>${seen}</b>people you can see · <b>${hosts}</b>open to hosting`; }
        if(s.tool==='find_people_by_city' && s.kind==='result'){ light(s.ids||[]); }
        if(s.tool==='check_availability'){ (s.ids||[]).forEach(id=>{ const p=personEls[id]; if(!p) return; p.circ.setAttribute('r','5'); }); }
        if(s.tool==='estimate_trip_cost' && s.kind==='tool'){ const c=cityFromText(s.text); if(c) pulse(c); }
        if(s.tool==='estimate_trip_cost' && s.kind==='result'){ const m=s.text.match(/\$(\d+) if .*?\$(\d+) otherwise/); const prev=steps[steps.indexOf(s)-1]; const c=prev&&cityFromText(prev.text); if(c&&m){ cityEls[c].price.textContent=`$${m[1]} / $${m[2]}`; cityEls[c].price.setAttribute('opacity','1'); } }
        if(s.tool==='get_city_media' && s.kind==='tool'){ const c=cityFromText(s.text); if(c){ pulse(c); const ce=cityEls[c]; for(let i=0;i<3;i++){ const r=el('rect',{x:-26+i*9,y:14,width:7,height:7,rx:1.5,fill:'#fbbf24',opacity:0,class:'photo'}); ce.g.appendChild(r); r.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:400,delay:i*120,fill:'forwards'}); } } }
        if(s.tool==='propose_trips'){ showCard(); }
      });
    });
    at(final?0:Math.min(TOTAL_MS, last.at*scale)+400, ()=>{ showCard(); showRuled(); });
    function showCard(){
      if(card.classList.contains('show')) return;
      const t=run.trips[0]; if(!t) return;
      // dim everyone except the people on the card
      const keep=new Set([t.host?.id, t.ride?.driver?.id, ...(t.people||[]).map(p=>p.id)].filter(Boolean));
      Object.values(personEls).forEach(p=>{ if(!keep.has(p.u.id)) p.circ.setAttribute('opacity','.12'); else { p.circ.setAttribute('r','6'); p.circ.setAttribute('fill','#fbbf24'); } });
      Object.keys(cityEls).forEach(c=>{ if(c!==t.city && c!==home) cityEls[c].g.setAttribute('opacity','.35'); });
      const cover=t.evidence?.[0]?.image ? `<div class="cover" style="background-image:url('${DATA.base}${t.evidence[0].image}')"></div>` : '';
      const rows=[t.host&&`<div class="row"><span class="av" style="background-image:url('${DATA.base}${t.host.avatar}')"></span><span><b>${t.host.name}</b> · host<div class="c">${t.host.connection}</div></span><span class="tag">Open to hosting</span></div>`,
        t.ride&&`<div class="row"><span class="av" style="background-image:url('${DATA.base}${t.ride.driver.avatar}')"></span><span><b>${t.ride.driver.name}</b> · driving, ${t.ride.seatsOpen} seats<div class="c">${t.ride.driver.connection}${t.ride.driver.via?` · intro via ${t.ride.driver.via.name.split(' ')[0]}`:''}</div></span></div>`,
        ...(t.people||[]).slice(0,2).map(p=>`<div class="row"><span class="av" style="background-image:url('${DATA.base}${p.avatar}')"></span><span><b>${p.name}</b> · there<div class="c">${p.connection}</div></span></div>`)].filter(Boolean).join('');
      card.innerHTML=`${cover}<div class="body"><div class="date">${t.start} → ${t.end} · ${t.nights} nights</div><h3>${t.title}</h3><div class="pricebox"><span class="big">~$${t.prices.ifYes.total}</span> <span>if ${t.prices.conditions.join(' and ')||'your people say yes'}</span><div><b>~$${t.prices.otherwise.total}</b> <span>otherwise · hotel trip ~$${t.prices.solo.total}</span></div></div>${rows}</div>`;
      card.classList.add('show');
    }
    function showRuled(){
      const t=run.trips[0]; if(!t) return;
      const others=run.trips.slice(1).map(x=>`<div><span class="x">○</span><span>${x.cityName}: ~$${x.prices.ifYes.total}${x.fitsBudget?'':' · over budget'} — ranked below (${x.host?x.host.degree===1?'friend hosting':'friend-of-friend hosting':'no host'})</span></div>`);
      const rep=(run.repairs||[]).slice(0,3).map(r=>`<div><span class="x">✕</span><span>${r}</span></div>`);
      const priced=run.steps.filter(s=>s.tool==='estimate_trip_cost'&&s.kind==='tool').map(s=>cityFromText(s.text)).filter(c=>c&&!run.trips.some(t=>t.city===c)).map(c=>`<div><span class="x">✕</span><span>${byCity[c].name}: priced, no host free or over budget</span></div>`);
      ruled.innerHTML=`<div style="color:#9ca3af;font-weight:700;margin-bottom:4px">ruled out or ranked lower</div>`+[...rep,...priced,...others].slice(0,5).join('');
      ruled.classList.add('show');
    }
  }
  const final = new URLSearchParams(location.search).get('final')==='1';
  play(final);
  window.addEventListener('keydown', e=>{ if(e.key==='r'||e.key==='R') play(false); });
  window.replayAgent = ()=>play(false);
})();
</script>
</body>
</html>
