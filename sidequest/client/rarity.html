<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#14161f" />
    <title>Sidequest</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='24' fill='%23ffb020'/><text x='50' y='68' font-family='Arial Black,Arial' font-weight='900' font-size='52' text-anchor='middle' fill='%2314161f'>?</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #14161f; --bg2: #1f2433; --card: #232838; --primary: #ffb020; --accent: #6ee7b7; --text: #f6f3ee;
        --on-primary: #14161f; --on-accent: #14161f;
        --muted: color-mix(in srgb, var(--text) 62%, transparent);
        --line: color-mix(in srgb, var(--text) 12%, transparent);
        --font: "Rubik", system-ui, sans-serif;
        --display: "Rubik";
        --t1: color-mix(in srgb, var(--text) 30%, var(--card));
        --t2: color-mix(in srgb, var(--accent) 30%, var(--card));
        --t3: color-mix(in srgb, var(--accent) 55%, var(--card));
        --t4: color-mix(in srgb, var(--accent) 80%, var(--card));
        --t5: color-mix(in srgb, var(--primary) 75%, var(--accent));
        --t6: var(--primary);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; min-height: 100%; }
      html { background: var(--bg2); }
      body {
        background: linear-gradient(170deg, var(--bg) 0%, var(--bg2) 100%) fixed; color: var(--text);
        font: 400 17px/1.4 var(--font); -webkit-font-smoothing: antialiased; overscroll-behavior: none;
      }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; border: 0; background: none; }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      h1, h2, .display { font-family: var(--display), var(--font); font-weight: 800; letter-spacing: -0.01em; margin: 0; }

      #app { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: max(14px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
      .col { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
      .enter { animation: enter 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
      @keyframes enter { from { opacity: 0; transform: translateY(10px); } }

      .btn {
        display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; padding: 14px 20px;
        border-radius: 18px; font-weight: 700; font-size: 19px; background: var(--primary); color: var(--on-primary);
        box-shadow: 0 5px 0 color-mix(in srgb, var(--primary) 55%, #000); transition: transform 0.07s, box-shadow 0.07s, filter 0.15s;
      }
      .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--primary) 55%, #000); }
      .btn[disabled] { filter: saturate(0.4) brightness(0.8); pointer-events: none; }
      .btn.alt { background: var(--card); color: var(--text); box-shadow: 0 5px 0 color-mix(in srgb, var(--card) 60%, #000), inset 0 0 0 2px var(--line); }
      .link { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 10px; font-size: 15px; align-self: center; }
      .card { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: 0 1px 0 color-mix(in srgb, var(--text) 8%, transparent) inset, 0 18px 40px -18px rgba(0, 0, 0, 0.55); }
      .field {
        width: 100%; min-height: 58px; padding: 14px 18px; border-radius: 18px; border: 2px solid var(--line); background: color-mix(in srgb, var(--bg) 70%, var(--card));
        font-size: 20px; font-weight: 600; outline: none; transition: border-color 0.15s;
      }
      .field:focus { border-color: var(--accent); }
      .field::placeholder { color: color-mix(in srgb, var(--text) 38%, transparent); font-weight: 500; }

      /* ---------- home ---------- */
      .home-hero { text-align: center; padding: 26px 0 6px; }
      .home-hero .mark { font-size: 54px; line-height: 1; }
      .home-hero h1 { font-size: 40px; margin-top: 10px; }
      .home-hero p { color: var(--muted); margin: 8px auto 0; max-width: 32ch; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      .chip { padding: 9px 15px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); font-weight: 600; font-size: 15px; }
      .chip:active { transform: scale(0.96); }
      .making { text-align: center; padding-top: 18vh; }
      .making .spin { font-size: 52px; display: inline-block; animation: wob 1.1s ease-in-out infinite; }
      @keyframes wob { 50% { transform: translateY(-8px) rotate(-8deg); } }
      .making p { color: var(--muted); }
      .error { color: #ff8f8f; font-size: 15px; text-align: center; }

      /* ---------- lobby ---------- */
      .lobby-head { text-align: center; padding-top: 10px; }
      .host-badge { width: 84px; height: 84px; margin: 0 auto; display: grid; place-items: center; font-size: 46px; border-radius: 28px; background: var(--card); box-shadow: 0 10px 0 -2px color-mix(in srgb, var(--card) 55%, #000); }
      .lobby-head h1 { font-size: clamp(32px, 9vw, 40px); line-height: 1.02; margin-top: 16px; color: var(--primary); }
      .lobby-head .tag { color: var(--muted); margin: 8px 0 0; }
      .speech { position: relative; background: var(--card); border-radius: 18px; padding: 14px 16px; font-size: 16px; }
      .speech b { display: block; font-size: 13px; color: var(--accent); margin-bottom: 2px; }
      .speech::before { content: ""; position: absolute; top: -8px; left: 34px; border: 9px solid transparent; border-top: 0; border-bottom-color: var(--card); }
      .how { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: start; font-size: 15px; color: var(--muted); }
      .how span:nth-child(odd) { font-size: 20px; line-height: 1.2; }
      .how b { color: var(--text); font-weight: 600; }

      .ladder { display: flex; flex-direction: column-reverse; gap: 5px; }
      .rung {
        position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 14px; border-radius: 12px;
        background: color-mix(in srgb, var(--bg) 55%, var(--card)); color: var(--muted); font-weight: 600; font-size: 15px;
        transition: background 0.25s, color 0.25s, transform 0.25s;
      }
      .rung small { font-weight: 700; font-variant-numeric: tabular-nums; opacity: 0.85; }
      .rung.lit[data-t="1"] { background: var(--t1); color: var(--on-t1); } .rung.lit[data-t="2"] { background: var(--t2); color: var(--on-t2); }
      .rung.lit[data-t="3"] { background: var(--t3); color: var(--on-t3); } .rung.lit[data-t="4"] { background: var(--t4); color: var(--on-t4); }
      .rung.lit[data-t="5"] { background: var(--t5); color: var(--on-t5); } .rung.lit[data-t="6"] { background: var(--t6); color: var(--on-t6); }
      .rung.you { transform: scale(1.03); box-shadow: 0 6px 20px -6px color-mix(in srgb, var(--primary) 70%, transparent); }
      .rung.you::after { content: "you"; position: absolute; right: -6px; top: -8px; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 99px; background: var(--text); color: var(--bg); }
      .ladder.mini .rung { padding: 6px 12px; font-size: 13px; }

      .board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      .board li { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: color-mix(in srgb, var(--bg) 55%, var(--card)); }
      .board li.me { background: color-mix(in srgb, var(--primary) 26%, var(--card)); }
      .board .pos { width: 26px; text-align: center; font-weight: 800; }
      .board .who { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .board .pts { font-weight: 800; font-variant-numeric: tabular-nums; }
      .board .sub { color: var(--muted); font-size: 13px; font-weight: 500; }
      .section-title { font-size: 15px; font-weight: 700; color: var(--muted); margin: 4px 2px -4px; }

      /* ---------- play ---------- */
      .topbar { display: flex; align-items: center; gap: 12px; }
      .pips { display: flex; gap: 5px; flex: 1; }
      .pip { height: 8px; flex: 1; border-radius: 99px; background: var(--line); transition: background 0.3s; }
      .pip.done { background: var(--accent); }
      .pip.now { background: var(--text); }
      .meter { display: flex; align-items: baseline; gap: 6px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .meter small { font-weight: 600; color: var(--muted); font-size: 13px; }
      .meter .bump { animation: bump 0.5s cubic-bezier(0.3, 1.7, 0.5, 1); display: inline-block; }
      @keyframes bump { 40% { transform: scale(1.25); color: var(--accent); } }

      .prompt-card { padding: 22px 20px 18px; }
      .prompt-card .k { font-size: 14px; color: var(--muted); font-weight: 600; }
      .prompt-card h2 { font-size: clamp(26px, 7.6vw, 32px); line-height: 1.08; margin: 6px 0 8px; }
      .prompt-card .hint { color: var(--muted); font-size: 15px; margin: 0; }
      .clock { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 16px; }
      .clock i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; border-radius: inherit; }
      .clock.low i { background: #ff6b6b; }
      .answer-row { display: flex; gap: 8px; }
      .answer-row .btn { width: auto; min-width: 92px; }
      .feedback { min-height: 24px; font-size: 15px; color: #ffb0a8; text-align: center; transition: opacity 0.2s; }
      .feedback.checking { color: var(--muted); }
      .shake { animation: shake 0.32s; }
      @keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
      .tries { display: flex; gap: 6px; justify-content: center; }
      .tries i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
      .tries i.used { background: #ff8f8f; }
      .giveup { align-self: center; }

      /* ---------- reveal ---------- */
      .reveal { display: flex; flex-direction: column; gap: 14px; }
      .verdict { text-align: center; }
      .verdict .your { font-size: 14px; color: var(--muted); font-weight: 600; }
      .verdict h2 { font-size: clamp(30px, 9vw, 40px); line-height: 1.05; margin: 4px 0; }
      .verdict .pts { display: inline-flex; align-items: baseline; gap: 6px; font-weight: 800; font-size: 22px; color: var(--accent); }
      .verdict.miss h2 { color: var(--muted); }
      .tier-name { display: inline-block; padding: 5px 12px; border-radius: 99px; font-weight: 800; font-size: 15px; margin-top: 6px; }
      .note { font-size: 15px; color: var(--muted); text-align: center; margin: 0; }
      .same { font-size: 15px; text-align: center; margin: 0; }
      .gem { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; }
      .gem .g { font-size: 24px; line-height: 1; }
      .gem p { margin: 0; font-size: 15px; color: var(--muted); }
      .gem b { color: var(--text); }
      .friends { display: flex; flex-wrap: wrap; gap: 6px; }
      .fa { display: inline-flex; gap: 6px; align-items: baseline; padding: 6px 10px; border-radius: 10px; background: color-mix(in srgb, var(--bg) 55%, var(--card)); font-size: 14px; }
      .fa b { font-weight: 700; }
      .fa small { color: var(--muted); }
      .fa[data-t="5"], .fa[data-t="6"] { box-shadow: inset 0 0 0 2px var(--primary); }

      /* ---------- results ---------- */
      .total { text-align: center; padding: 26px 20px; }
      .total .big { font-family: var(--display), var(--font); font-weight: 800; font-size: clamp(48px, 15vw, 64px); line-height: 1; color: var(--primary); font-variant-numeric: tabular-nums; }
      .total .unit { color: var(--muted); font-weight: 600; margin-top: 6px; }
      .total .standing { margin: 12px 0 0; font-weight: 600; }
      .rows { display: flex; flex-direction: column; gap: 10px; }
      .row { padding: 14px 16px; }
      .row .q { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
      .mine-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
      .mine { display: inline-flex; align-items: baseline; gap: 8px; padding: 7px 12px; border-radius: 12px; font-weight: 700; }
      .mine small { font-weight: 600; opacity: 0.85; white-space: nowrap; }
      .only { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--on-accent); white-space: nowrap; }
      .toast { text-align: center; color: var(--muted); font-size: 14px; min-height: 20px; margin: 0; }

      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="/rarity.js"></script>
  </body>
</html>
