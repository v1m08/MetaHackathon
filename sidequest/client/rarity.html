<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#14161f" />
    <title>Deep Cuts</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='%2314161f'/><rect x='3' y='3' width='10' height='10' fill='%23ffb020'/><rect x='6' y='5' width='4' height='2' fill='%2314161f'/><rect x='8' y='7' width='2' height='2' fill='%2314161f'/><rect x='7' y='10' width='2' height='2' fill='%2314161f'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Only the world is pixel art. Everything on top of it is clean, normal UI. */
      :root {
        --primary: #ffb020; --accent: #6ee7b7; --on-primary: #14161f; --on-accent: #14161f;
        --panel: rgba(12, 15, 25, 0.8); --line: rgba(255, 255, 255, 0.1); --ink: #f6f4ef; --muted: #aab1c5;
        --t1: #5a6072; --t2: #3f8f8a; --t3: #4fbf9f; --t4: #6ee7b7; --t5: #ffc94a; --t6: #ffb020;
        --on-t1: #fff; --on-t2: #fff; --on-t3: #111; --on-t4: #111; --on-t5: #111; --on-t6: #111;
        --font: "Rubik", system-ui, -apple-system, sans-serif;
        --gutter: 46px; /* room for the gauge on the right */
        --r: 18px;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; background: #0b0d14; overflow: hidden; overscroll-behavior: none; }
      body { color: var(--ink); font: 400 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }
      input { -webkit-user-select: text; user-select: text; }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; border: 0; background: none; }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

      /* ---------- the pixel world ---------- */
      #world { position: fixed; inset: 0; overflow: hidden; }
      .scene-canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
      .gauge { position: absolute; top: 0; right: 0; bottom: 0; width: var(--gutter); pointer-events: none; }
      .gauge-line { position: absolute; right: 9px; top: 0; bottom: 0; width: 2px; background: rgba(255, 255, 255, 0.4); border-radius: 2px; }
      .tick { position: absolute; right: 14px; top: -8px; font: 600 10px/16px var(--font); padding: 0 4px; border-radius: 5px; background: rgba(8, 10, 18, 0.62); color: #eef2ff; white-space: nowrap; }
      .marker { position: absolute; right: 14px; top: -10px; font: 700 11px/20px var(--font); padding: 0 7px; border-radius: 99px; background: var(--accent); color: var(--on-accent); white-space: nowrap; transition: transform 0.4s, opacity 0.3s; max-width: 84px; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); }
      .marker.me { background: var(--primary); color: var(--on-primary); z-index: 2; }
      .marker.off { opacity: 0.5; }

      /* ---------- UI over the world ---------- */
      /* --vv-*: the area above the on-screen keyboard (set from visualViewport in main.ts). */
      #ui { position: fixed; left: 0; right: 0; top: var(--vv-top, 0px); height: var(--vv-h, 100%); display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); pointer-events: none; }
      #ui > * { pointer-events: auto; }
      .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .scroll::-webkit-scrollbar { display: none; }
      .center { width: 100%; max-width: 560px; margin: 0 auto; }
      .gut { padding-right: var(--gutter); }

      .panel { background: var(--panel); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
      .panel.thin { padding: 8px 12px; border-radius: 14px; }
      .label { font: 600 13px/1.3 var(--font); color: var(--muted); }
      .label.hot { color: var(--accent); }

      .btn {
        display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 18px; border-radius: 16px;
        font: 700 17px/1 var(--font); background: var(--primary); color: var(--on-primary);
        box-shadow: 0 4px 0 color-mix(in srgb, var(--primary) 55%, #000), 0 8px 18px rgba(0, 0, 0, 0.25);
        transition: transform 0.07s, box-shadow 0.07s, filter 0.15s;
      }
      .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--primary) 55%, #000); }
      .btn.big { min-height: 60px; font-size: 19px; width: 100%; }
      .btn.dark { background: var(--panel); color: var(--ink); border: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); }
      .btn.wide { width: 100%; }
      .btn[disabled] { filter: grayscale(0.6) brightness(0.8); pointer-events: none; }
      .icon-btn { min-height: 42px; min-width: 42px; padding: 0 10px; font-size: 16px; border-radius: 13px; }

      .field {
        width: 100%; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 2px solid var(--line); outline: none;
        background: rgba(8, 10, 18, 0.88); color: var(--ink); font: 500 18px var(--font); transition: border-color 0.15s;
      }
      .field:focus { border-color: var(--accent); }
      .field::placeholder { color: #737b94; }

      .pop { animation: pop 0.32s cubic-bezier(0.2, 1.2, 0.4, 1) both; }
      @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(0.98); } }
      .shake { animation: shake 0.3s; }
      @keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
      .blink { animation: blink 1.2s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0.45; } }

      /* ---------- titles ---------- */
      .title-wrap { text-align: center; margin-top: 5vh; }
      .title { font: 800 clamp(34px, 10vw, 60px)/1 var(--font); letter-spacing: -0.02em; color: #fff; margin: 0; text-wrap: balance; text-shadow: 0 3px 0 var(--primary), 0 6px 18px rgba(0, 0, 0, 0.55); }
      .subtitle { margin: 12px auto 0; font: 500 16px/1.4 var(--font); color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); max-width: 30ch; }
      .stack { display: flex; flex-direction: column; gap: 10px; }
      .row { display: flex; gap: 10px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      .chip { font: 500 14px var(--font); padding: 8px 13px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
      .chip:active { transform: translateY(1px); }
      .bottom { margin-top: auto; }

      .speech { display: flex; gap: 12px; align-items: flex-start; }
      .speech .who { font-size: 32px; line-height: 1; }
      .speech p { margin: 3px 0 0; }

      .tiers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
      @media (max-width: 560px) { .tiers { grid-template-columns: repeat(3, 1fr); } }
      .tier { font: 600 11px/1.15 var(--font); padding: 7px 4px; text-align: center; border-radius: 10px; min-height: 44px; display: flex; flex-direction: column; justify-content: center; gap: 2px; transition: transform 0.2s, filter 0.2s; }
      .tier b { font: 800 15px var(--font); }
      .tier[data-t="1"] { background: var(--t1); color: var(--on-t1); } .tier[data-t="2"] { background: var(--t2); color: var(--on-t2); }
      .tier[data-t="3"] { background: var(--t3); color: var(--on-t3); } .tier[data-t="4"] { background: var(--t4); color: var(--on-t4); }
      .tier[data-t="5"] { background: var(--t5); color: var(--on-t5); } .tier[data-t="6"] { background: var(--t6); color: var(--on-t6); }
      .tier.dim { filter: grayscale(0.85) brightness(0.45); }
      .tier.you { transform: scale(1.06); box-shadow: 0 0 0 2px #fff, 0 6px 16px rgba(0, 0, 0, 0.4); }

      .board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
      .board li { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
      .board li:last-child { border-bottom: 0; }
      .board li.me { color: var(--primary); }
      .board .pos { font-weight: 700; width: 22px; color: var(--muted); }
      .board .who { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .board .pts { font-weight: 700; font-variant-numeric: tabular-nums; }

      /* ---------- play ---------- */
      .hud { display: flex; gap: 8px; align-items: stretch; }
      .meter-box { min-width: 82px; }
      .meter-box .v { font: 800 20px/1.1 var(--font); color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .meter-box .v.bump { animation: bump 0.45s cubic-bezier(0.3, 1.8, 0.5, 1); }
      @keyframes bump { 45% { transform: scale(1.18); color: #fff; } }
      .progress { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; min-width: 0; }
      .pips { display: flex; gap: 4px; }
      .pip { width: 12px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); }
      .pip.done { background: var(--accent); } .pip.now { background: #fff; }
      .hud-right { display: flex; gap: 6px; margin-left: auto; }

      .prompt { margin-top: 14px; padding: 18px; }
      .prompt h1 { font: 800 clamp(25px, 7vw, 36px)/1.12 var(--font); letter-spacing: -0.01em; margin: 6px 0 8px; text-wrap: balance; }
      .prompt .hint { margin: 0; color: var(--muted); font-size: 15px; }
      .prompt .sub { margin: 10px 0 0; font: 500 13px var(--font); color: var(--accent); }

      .feedback { min-height: 24px; text-align: center; margin: 6px 0; font: 600 16px var(--font); color: #ffb0a8; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8); }
      .feedback.checking { color: #fff; }
      .answer { display: flex; flex-direction: column; gap: 8px; }
      .answer-row { display: flex; gap: 8px; align-items: center; }
      .answer-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
      .timer { flex: none; width: 52px; height: 52px; position: relative; display: grid; place-items: center; font: 800 18px var(--font); }
      .timer svg { position: absolute; inset: 0; transform: rotate(-90deg); }
      .timer span { position: relative; z-index: 1; font-variant-numeric: tabular-nums; }
      .timer circle { fill: rgba(8, 10, 18, 0.88); stroke-width: 5; }
      .timer .track { stroke: rgba(255, 255, 255, 0.15); }
      .timer .left { stroke: var(--accent); stroke-linecap: round; transition: stroke 0.2s; }
      .timer.low .left { stroke: #ff6b6b; }
      .timer.low span { color: #ff8f8f; }
      .tries { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
      .tries i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.25); }
      .tries i.used { background: #ff6b6b; }

      /* ---------- reveal ---------- */
      .reveal { margin-top: 14px; text-align: center; }
      .reveal .q { font: 600 13px var(--font); color: var(--muted); }
      .reveal h1 { font: 800 clamp(30px, 9vw, 46px)/1.05 var(--font); letter-spacing: -0.01em; margin: 8px 0 12px; text-wrap: balance; }
      .reveal.miss h1 { color: var(--muted); }
      .gain { font: 800 20px var(--font); color: var(--accent); }
      .reveal .note { color: var(--muted); margin: 10px 0 0; font-size: 15px; }
      .reveal .social { margin: 10px 0 0; font-size: 15px; }
      .only { display: inline-block; font: 700 12px var(--font); padding: 3px 8px; border-radius: 99px; background: var(--accent); color: var(--on-accent); vertical-align: 1px; }
      .gem { margin-top: 12px; text-align: left; font-size: 15px; color: var(--muted); display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); }
      .gem b { color: #fff; }
      .friends { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
      .fa { font-size: 14px; padding: 5px 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.09); }
      .fa small { color: var(--muted); margin-right: 5px; font-size: 12px; }

      /* ---------- results ---------- */
      .total { text-align: center; margin-top: 3vh; }
      .total .big { font: 800 clamp(48px, 15vw, 76px)/1 var(--font); letter-spacing: -0.02em; color: #fff; text-shadow: 0 3px 0 var(--primary), 0 6px 18px rgba(0, 0, 0, 0.5); font-variant-numeric: tabular-nums; }
      .total .standing { margin: 12px auto 0; font: 600 16px/1.4 var(--font); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75); max-width: 30ch; }
      .answers { display: flex; flex-direction: column; gap: 10px; }
      .ans .q { font: 600 13px var(--font); color: var(--muted); margin-bottom: 8px; }
      .mine-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .mine { font-size: 17px; font-weight: 700; padding: 5px 12px; border-radius: 99px; }
      .mine small { font-size: 12px; font-weight: 600; margin-left: 6px; opacity: 0.85; }
      .ans .friends { justify-content: flex-start; margin-top: 8px; }
      .ans .gemline { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
      .toast { min-height: 20px; text-align: center; margin: 0; font-size: 14px; text-shadow: 0 1px 6px #000; }
      .making { text-align: center; margin-top: 30vh; }
      .making h1 { font: 800 38px var(--font); margin: 0; text-shadow: 0 3px 0 var(--primary), 0 6px 18px rgba(0, 0, 0, 0.5); }
      .making p { font: 500 15px/1.5 var(--font); text-shadow: 0 1px 8px #000; }
      .error { color: #ffb0a8; text-align: center; font-size: 15px; text-shadow: 0 1px 6px #000; }

      /* smaller tier grid in the lobby */
      .tiers-small .tier { min-height: 34px; padding: 5px 3px; font-size: 10px; border-radius: 8px; }
      .tiers-small .tier b { font-size: 13px; }
      /* compact answer list on results */
      .ans-list { list-style: none; margin: 6px 0 0; padding: 0; }
      .ans-list li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
      .ans-list li:last-child { border-bottom: 0; }
      .ans-list .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
      .ans-list .body { flex: 1; min-width: 0; }
      .ans-list .body b { font-weight: 700; }
      .ans-list .body small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ans-list .pts { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); }

      /* dim the world so text on top reads cleanly */
      #world::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(6, 8, 16, 0.62) 0%, rgba(6, 8, 16, 0.28) 38%, rgba(6, 8, 16, 0.28) 62%, rgba(6, 8, 16, 0.7) 100%); }

      /* poster lobby: title on top, actions at the bottom, world in between */
      .poster { text-align: center; margin-top: 7vh; }
      .poster .title { font-size: clamp(38px, 11vw, 66px); }
      .poster-actions { margin-top: auto; width: 100%; max-width: 440px; align-self: center; display: flex; flex-direction: column; gap: 10px; }
      .leaders { margin: 0 0 4px; text-align: center; font: 500 15px var(--font); color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); }
      .leaders b { font-weight: 700; color: var(--accent); }
      .leaders .me { color: var(--primary); }
      .leaders .sep { margin: 0 8px; opacity: 0.5; }
      .link-btn { align-self: center; padding: 8px 12px; font: 600 15px var(--font); color: #fff; text-decoration: underline; text-underline-offset: 3px; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); }
      .sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; padding: 12px; background: rgba(0, 0, 0, 0.45); }
      .sheet[hidden] { display: none; }
      .sheet-card { width: 100%; max-width: 440px; animation: pop 0.25s ease-out both; }
      .rules-text { margin: 12px 0; font-size: 15px; color: var(--muted); }

      /* quieter results: centered, plain rows */
      .results { display: flex; flex-direction: column; align-items: center; }
      .results .total { margin-top: 5vh; }
      .results .leaders { margin: 16px 0 0; }
      .quiet-list { width: 100%; max-width: 400px; margin-top: 16px; padding: 4px 16px; }
      .quiet-list .ans-list { margin: 0; }
      .quiet-list li { padding: 10px 0; }

      /* Keyboard open (or a very short screen): keep the question, the box and the buttons all visible. */
      .short #ui { padding-top: 6px; padding-bottom: 6px; }
      .short .hud .panel.thin { padding: 4px 10px; }
      .short .prompt { margin-top: 6px; padding: 10px 14px; }
      .short .prompt h1 { font-size: 21px; margin: 2px 0 2px; }
      .short .prompt .hint { font-size: 13px; }
      .short .prompt .sub, .short .tries { display: none; }
      .short .feedback { min-height: 20px; margin: 2px 0 4px; font-size: 15px; }
      .short .answer { gap: 6px; }
      .short .answer-actions .btn { min-height: 44px; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
    </style>
  </head>
  <body>
    <div id="world"></div>
    <main id="ui"></main>
    <script src="/rarity.js"></script>
  </body>
</html>
