<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14161f" />
    <title>Ghost Run</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Same house style as Deep Cuts: pixel world underneath, clean UI on top. */
      :root { --primary: #ff5d3a; --accent: #ffd23f; --on-primary: #111; --panel: rgba(12, 15, 25, 0.8); --line: rgba(255, 255, 255, 0.1); --ink: #f6f4ef; --muted: #aab1c5; --font: "Rubik", system-ui, -apple-system, sans-serif; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; background: #0b0d14; overflow: hidden; overscroll-behavior: none; }
      body { color: var(--ink); font: 400 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; touch-action: none; }
      button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      #world { position: fixed; inset: 0; overflow: hidden; }
      #world.dim::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(6, 8, 16, 0.62) 0%, rgba(6, 8, 16, 0.25) 38%, rgba(6, 8, 16, 0.25) 62%, rgba(6, 8, 16, 0.75) 100%); }
      .scene-canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
      #tags { position: fixed; inset: 0; pointer-events: none; }
      .tag { position: absolute; transform: translate(-50%, -100%); font: 700 11px/18px var(--font); padding: 0 7px; border-radius: 99px; background: rgba(10, 12, 20, 0.7); color: #fff; white-space: nowrap; }
      #ui { position: fixed; inset: 0; display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom)); pointer-events: none; }
      #ui > * { pointer-events: auto; }
      .center { width: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; flex: 1; min-height: 0; }
      .panel { background: var(--panel); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
      .btn { display: flex; align-items: center; justify-content: center; min-height: 58px; width: 100%; border-radius: 16px; font: 800 19px var(--font); background: var(--primary); color: var(--on-primary); box-shadow: 0 4px 0 color-mix(in srgb, var(--primary) 55%, #000), 0 8px 18px rgba(0, 0, 0, 0.25); }
      .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--primary) 55%, #000); }
      .btn.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); }
      .icon { width: 42px; height: 42px; border-radius: 13px; background: var(--panel); border: 1px solid var(--line); font-size: 16px; display: grid; place-items: center; }
      .link { align-self: center; padding: 8px 12px; font: 600 15px var(--font); color: #fff; text-decoration: underline; text-underline-offset: 3px; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); }
      .top { display: flex; gap: 8px; align-items: center; }
      .top .grow { flex: 1; }
      .title { margin: 7vh 0 0; text-align: center; font: 800 clamp(38px, 11vw, 64px)/1 var(--font); letter-spacing: -0.02em; color: #fff; text-shadow: 0 3px 0 var(--primary), 0 6px 18px rgba(0, 0, 0, 0.55); text-wrap: balance; }
      .sub { margin: 12px auto 0; text-align: center; font: 500 16px/1.4 var(--font); color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8); max-width: 30ch; }
      .bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
      .leaders { margin: 0 0 4px; text-align: center; font: 500 15px var(--font); color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); }
      .leaders b { color: var(--accent); }
      .leaders .me { color: var(--primary); }
      .leaders .sep { margin: 0 8px; opacity: 0.5; }
      /* race HUD */
      .hud { display: flex; gap: 8px; align-items: stretch; }
      .hud .panel { padding: 8px 12px; border-radius: 14px; }
      .clock { font: 800 24px/1 var(--font); font-variant-numeric: tabular-nums; min-width: 92px; text-align: center; }
      .place { font: 800 18px/1 var(--font); color: var(--accent); }
      .bar { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
      .bar .track { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.15); position: relative; }
      .bar .track i { position: absolute; top: -3px; width: 14px; height: 14px; border-radius: 50%; transform: translateX(-50%); background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4); }
      .bar .track i.g { background: rgba(255, 255, 255, 0.45); width: 10px; height: 10px; top: -1px; }
      .bar .lbl { font: 600 12px var(--font); color: var(--muted); display: flex; justify-content: space-between; }
      .hint { margin-top: auto; text-align: center; font: 600 15px var(--font); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); opacity: 0.9; transition: opacity 0.5s; }
      .count { position: fixed; inset: 0; display: grid; place-items: center; font: 800 110px var(--font); color: #fff; text-shadow: 0 5px 0 var(--primary), 0 10px 26px rgba(0, 0, 0, 0.5); pointer-events: none; }
      .count span { animation: pop 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); }
      .banner { position: fixed; left: 0; right: 0; top: 28%; text-align: center; font: 800 34px var(--font); color: #fff; text-shadow: 0 3px 0 var(--primary), 0 6px 18px rgba(0, 0, 0, 0.6); pointer-events: none; animation: pop 0.3s cubic-bezier(0.3, 1.6, 0.5, 1); }
      @keyframes pop { from { transform: scale(0.6); opacity: 0; } }
      /* results */
      .total { text-align: center; margin-top: 5vh; }
      .total .lbl { font: 600 14px var(--font); color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); }
      .total .big { font: 800 clamp(56px, 17vw, 84px)/1 var(--font); color: #fff; text-shadow: 0 3px 0 var(--primary), 0 6px 18px rgba(0, 0, 0, 0.5); font-variant-numeric: tabular-nums; }
      .total .standing { margin: 12px 0 0; font: 600 16px var(--font); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8); }
      .board { list-style: none; margin: 16px auto 0; padding: 4px 16px; width: 100%; max-width: 380px; }
      .board li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
      .board li:last-child { border-bottom: 0; }
      .board li.me { color: var(--accent); }
      .board .who { flex: 1; }
      .board .t { font-variant-numeric: tabular-nums; }
      .sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; padding: 12px; background: rgba(0, 0, 0, 0.45); }
      .sheet[hidden] { display: none; }
      .sheet .panel { width: 100%; max-width: 440px; }
      .sheet ol { margin: 8px 0 14px; padding-left: 20px; color: var(--muted); }
      .sheet li { margin: 6px 0; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
    </style>
  </head>
  <body>
    <div id="world"></div>
    <div id="tags"></div>
    <main id="ui"></main>
    <script src="/run.js"></script>
  </body>
</html>
