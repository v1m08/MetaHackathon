<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e6d3bd" />
    <title>Sketch Off</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* House style: pixel art for the world (studio + drawings), clean UI on top. */
      :root { --primary: #e8492f; --accent: #2f6fd1; --on-primary: #fff; --panel: rgba(18, 16, 22, 0.82); --line: rgba(255, 255, 255, 0.12); --ink: #f6f4ef; --muted: #b8b2a8; --font: "Rubik", system-ui, -apple-system, sans-serif; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; background: #1b1814; overflow: hidden; overscroll-behavior: none; }
      body { color: var(--ink); font: 400 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }
      input { -webkit-user-select: text; user-select: text; }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; border: 0; background: none; }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      #studio { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
      #shade { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(10, 8, 6, 0.45) 0%, rgba(10, 8, 6, 0.1) 40%, rgba(10, 8, 6, 0.15) 60%, rgba(10, 8, 6, 0.7) 100%); }
      #ui { position: fixed; inset: 0; display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom)); overflow-y: auto; }
      .center { width: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; flex: 1; min-height: 0; gap: 10px; }
      .panel { background: var(--panel); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
      .btn { display: flex; align-items: center; justify-content: center; min-height: 56px; width: 100%; border-radius: 16px; font: 800 19px var(--font); background: var(--primary); color: var(--on-primary); box-shadow: 0 4px 0 color-mix(in srgb, var(--primary) 55%, #000), 0 8px 18px rgba(0, 0, 0, 0.25); }
      .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--primary) 55%, #000); }
      .btn.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); }
      .btn[disabled] { filter: grayscale(0.6) brightness(0.8); pointer-events: none; }
      .icon { width: 42px; height: 42px; border-radius: 13px; background: var(--panel); border: 1px solid var(--line); font-size: 16px; display: grid; place-items: center; flex: none; }
      .link { align-self: center; padding: 8px 12px; font: 600 15px var(--font); color: #fff; text-decoration: underline; text-underline-offset: 3px; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); }
      .top { display: flex; gap: 8px; align-items: center; }
      .top .grow { flex: 1; min-width: 0; }
      .title { margin: 6vh 0 0; text-align: center; font: 800 clamp(38px, 11vw, 62px)/1 var(--font); letter-spacing: -0.02em; color: #fff; text-shadow: 0 3px 0 var(--primary), 0 6px 18px rgba(0, 0, 0, 0.55); text-wrap: balance; }
      .sub { margin: 10px auto 0; text-align: center; font: 500 16px/1.4 var(--font); color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85); max-width: 30ch; }
      .host { font-size: 54px; text-align: center; line-height: 1; margin-top: 4vh; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35)); }
      .bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
      .leaders { margin: 0 0 4px; text-align: center; font: 500 15px var(--font); color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); }
      .leaders b { color: #ffd166; }
      .leaders .me { color: var(--primary); }
      .leaders .sep { margin: 0 8px; opacity: 0.5; }
      .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); font: 700 15px var(--font); }
      .timer { font: 800 20px var(--font); font-variant-numeric: tabular-nums; }
      .timer.low { color: #ff8f8f; }
      .prompt { text-align: center; }
      .prompt .k { font: 600 13px var(--font); color: var(--muted); }
      .prompt .w { font: 800 30px/1.1 var(--font); letter-spacing: -0.01em; }
      .prompt .blanks { font: 800 26px var(--font); letter-spacing: 6px; }
      /* the paper */
      .paper { position: relative; align-self: center; width: min(100%, 52vh, 380px); aspect-ratio: 1; border-radius: 10px; background: #fffdf8; padding: 10px; box-shadow: 0 0 0 6px #8a5a3a, 0 0 0 9px #5a3a24, 0 14px 28px rgba(0, 0, 0, 0.45); }
      .paper canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; touch-action: none; background: repeating-linear-gradient(0deg, transparent 0 calc(100% / 12 - 1px), rgba(40, 60, 90, 0.06) calc(100% / 12 - 1px) calc(100% / 12)), repeating-linear-gradient(90deg, transparent 0 calc(100% / 12 - 1px), rgba(40, 60, 90, 0.06) calc(100% / 12 - 1px) calc(100% / 12)); }
      .tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
      .ink { width: 32px; height: 32px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.25); }
      .ink.on { border-color: #fff; transform: scale(1.12); }
      .ink.eraser { background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 10px 10px !important; }
      .tool { height: 34px; padding: 0 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font: 700 14px var(--font); }
      .tool.on { border-color: #fff; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .field { width: 100%; min-height: 54px; padding: 0 16px; border-radius: 16px; border: 2px solid var(--line); outline: none; background: rgba(10, 8, 6, 0.85); color: var(--ink); font: 600 18px var(--font); }
      .field:focus { border-color: var(--accent); }
      .shake { animation: shake 0.3s; }
      @keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
      .verdict { text-align: center; font: 700 17px/1.4 var(--font); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); min-height: 24px; }
      .verdict b { color: #ffd166; }
      .pop { animation: pop 0.3s cubic-bezier(0.3, 1.6, 0.5, 1); }
      @keyframes pop { from { transform: scale(0.7); opacity: 0; } }
      /* results gallery */
      .total { text-align: center; margin-top: 4vh; }
      .total .lbl { font: 600 14px var(--font); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); }
      .total .big { font: 800 clamp(52px, 16vw, 78px)/1 var(--font); text-shadow: 0 3px 0 var(--primary), 0 6px 18px rgba(0, 0, 0, 0.5); font-variant-numeric: tabular-nums; }
      .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
      .card { background: #fffdf8; color: #2a1d14; border-radius: 10px; padding: 6px 6px 8px; box-shadow: 0 6px 12px rgba(0, 0, 0, 0.35); }
      .card canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; display: block; }
      .card .cap { font: 700 13px/1.25 var(--font); margin-top: 5px; }
      .card .meta { font: 500 11px/1.3 var(--font); color: #7a6a5a; }
      .sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; padding: 12px; background: rgba(0, 0, 0, 0.45); }
      .sheet[hidden] { display: none; }
      .sheet .panel { width: 100%; max-width: 440px; }
      .sheet ol { margin: 8px 0 14px; padding-left: 20px; color: var(--muted); }
      .sheet li { margin: 6px 0; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
    </style>
  </head>
  <body>
    <canvas id="studio" aria-hidden="true"></canvas>
    <div id="shade"></div>
    <main id="ui"></main>
    <script src="/sketch.js"></script>
  </body>
</html>
