<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121019" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Sidequest</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='14' width='84' height='78' rx='22' fill='%23c9bda4'/><rect x='8' y='8' width='84' height='76' rx='22' fill='%23fffdf8'/><text x='50' y='66' font-family='Arial Black,Arial' font-weight='900' font-size='52' text-anchor='middle' fill='%23262a33'>S</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --background: #121019;
        --surface: #221d30;
        --primary: #ff5d73;
        --accent: #ffd166;
        --danger: #ff4d6d;
        --text: #fff7ec;
        --on-primary: #111;
        --on-accent: #111;
        --font: "Rubik", system-ui, sans-serif;
        --display: "Rubik";
        --display-style: normal;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
        background: var(--background); color: var(--text); font-family: var(--font);
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        transition: background-color 0.3s;
      }
      #app { position: fixed; inset: 0; }
      .screen {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        animation: in 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      .screen.playing { padding: 0; animation: none; touch-action: none; }
      @keyframes in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
      .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .game-canvas { display: block; touch-action: none; }
      h1 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }
      button { font-family: var(--font); cursor: pointer; border: 0; }
      .btn {
        display: block; width: 100%; padding: 15px 20px; border-radius: 18px; font-size: 19px; font-weight: 600;
        transition: transform 0.08s ease-out, filter 0.15s; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
      }
      .btn:active { transform: translateY(3px) scale(0.98); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); }
      .btn.primary { background: var(--primary); color: var(--on-primary); }
      .btn.accent { background: var(--accent); color: var(--on-accent); }
      .btn.big { font-size: 22px; padding: 18px 20px; }
      .link { background: none; color: var(--text); opacity: 0.7; font-size: 16px; padding: 10px; text-decoration: underline; text-underline-offset: 3px; }
      .mute {
        position: absolute; z-index: 5; top: max(12px, env(safe-area-inset-top)); right: 12px;
        width: 44px; height: 44px; border-radius: 50%; font-size: 20px;
        background: color-mix(in srgb, var(--surface) 80%, transparent); color: var(--text);
      }

      .home { width: 100%; max-width: 380px; text-align: center; }
      .home .logo { font-size: 64px; animation: bob 2.4s ease-in-out infinite; }
      .home h1 { font-size: 46px; color: var(--accent); }
      .home .sub { opacity: 0.8; font-size: 17px; margin: 6px 0 24px; }
      .ask { display: flex; flex-direction: column; gap: 12px; }
      .ask input {
        width: 100%; padding: 16px 18px; font: 600 19px var(--font); border-radius: 18px;
        border: 2px solid color-mix(in srgb, var(--text) 18%, transparent); background: var(--surface); color: var(--text); outline: none;
        -webkit-user-select: text; user-select: text;
      }
      .ask input:focus { border-color: var(--accent); }
      .ask input::placeholder { color: color-mix(in srgb, var(--text) 45%, transparent); }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
      .chip {
        padding: 9px 16px; border-radius: 999px; font-size: 16px; font-weight: 600;
        background: var(--surface); color: var(--text); border: 2px solid color-mix(in srgb, var(--text) 12%, transparent);
      }
      .chip:active { transform: scale(0.95); }

      .loading { text-align: center; }
      .spinner { font-size: 64px; animation: spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite; }
      .status { font-size: 19px; opacity: 0.85; min-height: 1.4em; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { 50% { transform: translateY(-8px) rotate(-6deg); } }

      .card {
        width: 100%; max-width: 380px; text-align: center; display: flex; flex-direction: column; gap: 10px;
        background: var(--surface); border-radius: 28px; padding: 28px 22px 18px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      .title-card .hero { font-size: 84px; line-height: 1; animation: bob 2s ease-in-out infinite; }
      .title-card h1 { font-family: var(--display), var(--font); font-style: var(--display-style); font-weight: 800; font-size: 42px; color: var(--primary); line-height: 1; filter: brightness(1.25); }
      .tagline { margin: 0; font-size: 18px; opacity: 0.9; }
      .how { margin: 4px 0 8px; font-size: 16px; opacity: 0.75; }
      .mods { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
      .mod {
        font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 5px 10px; border-radius: 999px;
        background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--text);
      }
      .challenge { background: var(--accent); color: var(--on-accent); border-radius: 14px; padding: 10px; font-size: 17px; }
      .results .verdict { margin: 0; font-size: 19px; opacity: 0.9; }
      .results .score { font-family: var(--display), var(--font); font-style: var(--display-style); font-size: 72px; font-weight: 700; color: var(--primary); line-height: 1; font-variant-numeric: tabular-nums; }
      .results .rank {
        align-self: center; font-size: 20px; font-weight: 700; padding: 6px 16px; border-radius: 999px;
        background: var(--accent); color: var(--on-accent); animation: in 0.4s 0.6s both cubic-bezier(0.2, 0.9, 0.3, 1.5);
      }
      .results .beat { margin: 2px 0 8px; opacity: 0.8; }
      .screen.scroll { overflow-y: auto; align-items: safe center; padding-top: max(68px, calc(env(safe-area-inset-top) + 56px)); }
      .name {
        width: 100%; padding: 13px 16px; font: 600 18px var(--font); text-align: center; border-radius: 14px;
        border: 2px solid color-mix(in srgb, var(--text) 18%, transparent); background: var(--background); color: var(--text); outline: none;
        -webkit-user-select: text; user-select: text;
      }
      .name:focus { border-color: var(--accent); }
      .shake { animation: shake 0.35s; border-color: var(--danger) !important; }
      @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
      .btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--text) 25%, transparent); font-size: 17px; padding: 12px; }
      .board-wrap { text-align: left; margin: 4px 0; }
      .board-wrap h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; margin: 6px 4px; }
      .board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
      .board li {
        display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px;
        background: color-mix(in srgb, var(--background) 55%, transparent); font-size: 17px;
      }
      .board li.me { background: color-mix(in srgb, var(--primary) 28%, var(--background)); }
      .board .pos { width: 28px; text-align: center; font-weight: 700; }
      .board .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .board .pts { font-weight: 700; font-variant-numeric: tabular-nums; }
      .empty { margin: 4px; opacity: 0.7; font-size: 15px; }
      .toast { margin: 0; font-size: 14px; opacity: 0.85; word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="/app.js"></script>
  </body>
</html>
